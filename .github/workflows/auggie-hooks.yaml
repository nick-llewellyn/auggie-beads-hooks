# Runs the Beads hook test suite and installer checks on Ubuntu and macOS.
name: Auggie hooks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect hook changes
    runs-on: ubuntu-latest
    outputs:
      auggie_hooks: ${{ steps.diff.outputs.auggie_hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          hooks=true
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            grep -qE '^(\.augment/|install\.sh$|\.github/workflows/auggie-hooks\.yaml$|README\.md$)' <<<"$changed" ||
              hooks=false
          fi
          echo "auggie_hooks=$hooks" >>"$GITHUB_OUTPUT"

  auggie-hooks:
    # Stubs `bd` in scratch directories so no real bead store is touched.
    # macOS runs under /bin/bash (3.2) to verify shim & installer compatibility.
    name: Hook tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.auggie_hooks == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hook & installer test suite
        run: |
          /bin/bash --version | head -1
          python3 --version
          /bin/bash .augment/hooks/test/run_tests.sh

      - name: Verify README file list
        run: |
          diff <(sed -n 's/^ *\(\.augment\/hooks\/[^ ]*\)$/\1/p' README.md | sort) \
            <(git ls-files .augment/hooks | sort)
