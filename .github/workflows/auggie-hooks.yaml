# Runs the Auggie Beads hook test suites, and checks install.sh, the per-user
# installer that projects use in place of a copy of the hooks.
name: Auggie hooks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main gets a group of its own, so a later push never cancels its
# run: each push run tests only what that push changed (see `changes`), and a
# cancelled one would leave its commits untested. A newer run on the same pull
# request still cancels the one before it, since each diffs the whole request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Auggie hook changes
    runs-on: ubuntu-latest
    outputs:
      auggie_hooks: ${{ steps.diff.outputs.auggie_hooks }}
    steps:
      # Actions are pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The hook suites take about ten minutes per platform, so they run only
      # when .augment/, install.sh or this workflow changes. A base that cannot
      # be read (a manual run, a new branch, a force push) runs them.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          hooks=true
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            grep -qE '^(\.augment/|install\.sh$|\.github/workflows/auggie-hooks\.yaml$)' <<<"$changed" ||
              hooks=false
          fi
          echo "auggie_hooks=$hooks" >>"$GITHUB_OUTPUT"

  auggie-hooks:
    # Every suite stubs `bd` and runs in scratch directories, so no bead store
    # is touched and `bd` need not be installed. macOS runs too: its /bin/bash
    # is 3.2, which the hooks support.
    name: Auggie hook tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.auggie_hooks == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scanner parses commands with `shfmt --to-json`; jq and python3 are
      # already on both runner images. Ubuntu installs a pinned release binary
      # (v3.12.0), checked against its SHA-256, so the leg does not depend on
      # Ubuntu's apt mirrors; macOS takes brew's latest. The suites still cover
      # two shfmt versions.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.12.0
          SHFMT_SHA256: d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install shfmt
          else
            # The pinned binary and its checksum are for x86_64 only.
            arch=$(uname -m)
            if [ "$arch" != x86_64 ]; then
              echo "::error::no pinned shfmt binary for $arch" >&2
              exit 1
            fi
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/shfmt" \
              "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
            echo "$SHFMT_SHA256  $RUNNER_TEMP/shfmt" | sha256sum -c -
            sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          fi
          shfmt --version

      # The wiring runs the two entry points directly, and the installer is run
      # as a command, so a lost executable bit disables them while `bash -n`
      # stays green.
      - name: Check hook syntax
        run: |
          rc=0
          for f in .augment/hooks/beads-prime.sh .augment/hooks/beads-sync.sh install.sh; do
            [ -x "$f" ] || { echo "ERROR: $f is not executable" >&2; rc=1; }
          done
          for f in .augment/hooks/*.sh .augment/hooks/lib/*.sh \
            .augment/hooks/test/*.sh install.sh; do
            bash -n "$f" || rc=1
          done
          python3 -m py_compile .augment/hooks/lib/command_scan.py || rc=1
          exit "$rc"

      # Installs this checkout under two temporary tags into a prefix holding a
      # space, rolls back, refuses bad tags, a release whose scanner does not
      # compile or whose install.sh is unusable, and a prefix holding a quote,
      # installs a release with no install.sh, keeps a running hook on its own
      # release when current moves, installs and wires a relative prefix under
      # an exported CDPATH, refuses an install whose destination appears
      # meanwhile, wires a scratch settings file beside other hooks, a
      # look-alike and stale entries, including ones with a redirection or run
      # through args, fails --status on settings it cannot read, cleans legacy
      # entries under every event, after a separator and without a hooks list,
      # and checks the README's list of supplied files. /bin/bash, as below.
      - name: Check the installer
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*" >&2; exit 1; }
          T=$(mktemp -d)
          P="$T/with space/abh"
          S="$T/settings.json"
          git tag -f v0.0.1-ci HEAD >/dev/null
          git tag -f v0.0.2-ci HEAD >/dev/null
          trap 'git tag -d v0.0.1-ci v0.0.2-ci >/dev/null; rm -rf "$T"' EXIT
          run() { /bin/bash ./install.sh --prefix "$P" --source "file://$PWD" --settings "$S" "$@"; }
          # Install, reinstall, install another and roll back.
          run v0.0.1-ci
          [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "current is not v0.0.1-ci"
          [ -x "$P/current/.augment/hooks/beads-sync.sh" ] || fail "entry point not executable"
          run v0.0.1-ci >"$T/out"; grep -q 'already installed' "$T/out" || fail "a reinstall must not clone again"
          run v0.0.2-ci
          [ "$(readlink "$P/current")" = v0.0.2-ci ] || fail "current did not move"
          run v0.0.1-ci >/dev/null
          [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "rollback did not move current"
          # A bad tag fails and leaves nothing behind.
          ! run v9.9.9 2>/dev/null || fail "an unknown tag must fail"
          ! run main 2>/dev/null || fail "a branch name must be refused"
          [ -z "$(find "$P" -maxdepth 1 -name '.install.*')" ] || fail "a failed install left a temporary directory"
          [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "a failed install moved current"
          # A release whose scanner does not compile is refused before current moves.
          git clone -q "file://$PWD" "$T/src"
          G() { git -C "$T/src" -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false "$@"; }
          printf '%s\n' ': >"$ABH_CI_MARK"' >>"$T/src/.augment/hooks/lib/command-scan.sh"
          G commit -qam marker
          G tag v0.0.4-ci
          printf 'def broken(:\n' >>"$T/src/.augment/hooks/lib/command_scan.py"
          G commit -qam broken
          G tag v0.0.3-ci
          ! /bin/bash ./install.sh --prefix "$P" --source "file://$T/src" v0.0.3-ci 2>/dev/null ||
            fail "a release whose scanner does not compile must be refused"
          [ ! -e "$P/v0.0.3-ci" ] || fail "a refused release was left installed"
          [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "a refused release moved current"
          # A release whose own install.sh is not executable, or does not parse, is
          # refused before current moves; one with no install.sh, as before v0.2.0, still
          # installs.
          base=$(G rev-parse v0.0.4-ci^)
          G checkout -q "$base"
          chmod -x "$T/src/install.sh"
          G commit -qam installer-not-executable
          G tag v0.0.6-ci
          chmod +x "$T/src/install.sh"
          { head -n 1 "$T/src/install.sh"; echo 'if then'; tail -n +2 "$T/src/install.sh"; } >"$T/install.new"
          mv "$T/install.new" "$T/src/install.sh"
          chmod +x "$T/src/install.sh"
          G commit -qam installer-syntax-error
          G tag v0.0.8-ci
          for t in v0.0.6-ci v0.0.8-ci; do
            ! /bin/bash ./install.sh --prefix "$P" --source "file://$T/src" "$t" 2>/dev/null ||
              fail "a release whose install.sh is not usable must be refused ($t)"
            [ ! -e "$P/$t" ] || fail "a refused release was left installed ($t)"
            [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "a refused release moved current ($t)"
          done
          G checkout -q "$base"
          G rm -q install.sh
          G commit -qm no-installer
          G tag v0.0.7-ci
          /bin/bash ./install.sh --prefix "$P" --source "file://$T/src" v0.0.7-ci >/dev/null ||
            fail "a release with no install.sh must still install"
          [ "$(readlink "$P/current")" = v0.0.7-ci ] && [ ! -e "$P/current/install.sh" ] ||
            fail "a release with no install.sh did not become current"
          run v0.0.1-ci >/dev/null
          # A hook run keeps the release it started in when current moves meanwhile:
          # the stub jq moves current to a release whose command-scan.sh leaves a mark.
          /bin/bash ./install.sh --prefix "$P" --source "file://$T/src" v0.0.4-ci >/dev/null
          run v0.0.1-ci >/dev/null
          mkdir -p "$T/bin" "$T/ws"
          printf '#!/bin/sh\nexit 0\n' >"$T/bin/bd"
          J=$(command -v jq)
          cat >"$T/bin/jq" <<EOF
          #!/bin/sh
          [ -e "$T/moved" ] || { : >"$T/moved"; ln -sfn v0.0.4-ci "$P/current"; }
          exec "$J" "\$@"
          EOF
          chmod +x "$T/bin/bd" "$T/bin/jq"
          jq -n --arg w "$T/ws" '{hook_event_name: "PostToolUse", workspace_roots: [$w], cwd: $w,
            tool_name: "bash", tool_input: {command: "ls"}}' |
            ABH_CI_MARK="$T/mark" PATH="$T/bin:$PATH" /bin/bash "$P/current/.augment/hooks/beads-sync.sh" >/dev/null 2>&1 || true
          [ -e "$T/moved" ] || fail "the stub jq never ran"
          [ ! -e "$T/mark" ] || fail "a hook run loaded a helper from the release current moved to"
          run v0.0.1-ci >/dev/null
          # An exported CDPATH does not reach the prefix: with CDPATH=. a relative
          # --prefix still installs, and a later --wire on its own finds the release.
          top=$PWD
          mkdir -p "$T/cdp"
          (cd "$T/cdp" && CDPATH=. /bin/bash "$top/install.sh" --prefix rel --source "file://$top" v0.0.1-ci) >/dev/null ||
            fail "a relative --prefix under an exported CDPATH must install"
          [ "$(readlink "$T/cdp/rel/current")" = v0.0.1-ci ] || fail "CDPATH install: current is not v0.0.1-ci"
          (cd "$T/cdp" && CDPATH=. /bin/bash "$top/install.sh" --prefix rel --settings "$T/cdp.json" --wire) >/dev/null ||
            fail "--wire with a relative --prefix under an exported CDPATH must find the release"
          c=$(jq -r '.hooks.SessionEnd[0].hooks[0].command' "$T/cdp.json")
          [ "$(printf '%s\n' "$c" | wc -l | tr -d ' ')" = 1 ] && [ -x "${c%/current/*}/current/.augment/hooks/beads-sync.sh" ] &&
            case $c in */cdp/rel/current/.augment/hooks/beads-sync.sh) ;; *) false ;; esac ||
            fail "CDPATH wiring names a wrong path: $c"
          # An install whose destination appears meanwhile, as another install of the
          # same tag publishes it, fails rather than nesting its checkout inside it: the
          # stub git publishes the destination as the checkout completes.
          rm -rf "$P/v0.0.2-ci"
          G0=$(command -v git)
          mkdir -p "$T/gitbin"
          cat >"$T/gitbin/git" <<EOF
          #!/bin/sh
          "$G0" "\$@" || exit
          case " \$* " in *" checkout "*) mkdir -p "$P/v0.0.2-ci/other" ;; esac
          EOF
          chmod +x "$T/gitbin/git"
          ! PATH="$T/gitbin:$PATH" /bin/bash ./install.sh --prefix "$P" --source "file://$PWD" v0.0.2-ci >"$T/out" 2>&1 ||
            fail "an install whose destination appeared meanwhile must fail"
          [ ! -e "$P/v0.0.2-ci/v0.0.2-ci" ] || fail "an overlapping install nested its checkout"
          ! grep -q 'installed v0.0.2-ci' "$T/out" || fail "an overlapping install reported success"
          [ "$(readlink "$P/current")" = v0.0.1-ci ] || fail "an overlapping install moved current"
          [ -z "$(find "$P" -maxdepth 1 -name '.install.*')" ] || fail "an overlapping install left a temporary directory"
          rm -rf "$P/v0.0.2-ci"
          run v0.0.2-ci >/dev/null
          run v0.0.1-ci >/dev/null
          # Wiring replaces any earlier entries for these hooks and keeps the rest.
          jq -n '{model: "m", hooks: {
            PostToolUse: [{matcher: "edit", hooks: [{type: "command", command: "/x/fmt.sh"}]},
                          {matcher: "launch-process", hooks: [{type: "command", command: "/old/beads-sync.sh"}]},
                          {matcher: "bash", hooks: [{type: "command", command: "\"/old hooks/beads-sync.sh\""}]},
                          {matcher: "bash", hooks: [{type: "command", command: "/old/beads-sync.sh 2>/dev/null"}]}],
            SessionEnd: [{hooks: [{type: "command", command: "/x/custom-beads-sync.sh"}]},
                         {hooks: [{type: "command", command: "bash", args: ["/old/beads-sync.sh"]}]}],
            Stop: [{hooks: [{type: "command", command: "/x/stop.sh"}]}]}}' >"$S"
          # Status and wiring know these hooks by their exact names, quoted or not.
          run --status >"$T/out"
          grep -qF 'wired: PostToolUse: "/old hooks/beads-sync.sh"' "$T/out" || fail "status missed a double-quoted entry"
          ! grep -q custom-beads-sync "$T/out" || fail "status counted another hook as these"
          grep -qF 'wired: PostToolUse: /old/beads-sync.sh 2>/dev/null' "$T/out" || fail "status missed an entry with a redirection"
          grep -qF 'wired: SessionEnd: bash /old/beads-sync.sh' "$T/out" || fail "status missed an entry run through args"
          run --wire >/dev/null
          [ -e "$S.bak" ] || fail "no backup kept"
          H="'$(cd "$P" && pwd -P)/current/.augment/hooks"
          jq -e --arg p "$H/beads-prime.sh'" --arg s "$H/beads-sync.sh'" '
            .model == "m"
            and ([.hooks.SessionStart[].hooks[].command] == [$p])
            and ([.hooks.SessionEnd[].hooks[].command] == ["/x/custom-beads-sync.sh", $s])
            and ([.hooks.PostToolUse[] | {m: .matcher, c: .hooks[].command}]
                 == [{m: "edit", c: "/x/fmt.sh"}, {m: "bash", c: $s}])
            and ([.hooks.Stop[].hooks[].command] == ["/x/stop.sh"])' "$S" >/dev/null ||
            fail "unexpected wiring: $(jq -c . "$S")"
          cp "$S" "$T/once"
          run --wire >"$T/out"; grep -q unchanged "$T/out" || fail "wiring twice must change nothing"
          cmp -s "$S" "$T/once" || fail "wiring twice changed the file"
          # The wired commands run through the shell, as Auggie runs them.
          mkdir -p "$T/ws"
          cmd=$(jq -r '.hooks.SessionStart[0].hooks[0].command' "$S")
          AUGMENT_PROJECT_DIR="$T/ws" sh -c "$cmd" </dev/null || fail "the wired prime command did not run"
          cmd=$(jq -r '.hooks.SessionEnd[-1].hooks[0].command' "$S")
          jq -n --arg w "$T/ws" '{hook_event_name: "SessionEnd", workspace_roots: [$w]}' |
            sh -c "$cmd" || fail "the wired sync command did not run"
          run --status >"$T/out"; grep -q 'wired: SessionEnd' "$T/out" || fail "status does not show the wiring"
          # A settings file --status cannot read is reported, not taken for no wiring.
          printf '{"hooks": ' >"$T/bad.json"
          ! /bin/bash ./install.sh --prefix "$P" --settings "$T/bad.json" --status >"$T/out" 2>&1 ||
            fail "status must fail on a settings file that is not JSON"
          ! grep -q 'wired: none' "$T/out" || fail "status reported no wiring for a file it could not read"
          mkdir -p "$T/nojq"
          for t in readlink grep; do ln -s "$(command -v "$t")" "$T/nojq/$t"; done
          ! PATH="$T/nojq" /bin/bash ./install.sh --prefix "$P" --settings "$S" --status >"$T/out" 2>&1 ||
            fail "status must fail without jq"
          ! grep -q 'wired: none' "$T/out" || fail "status reported no wiring without jq"
          # A prefix the shell cannot be handed is refused before the settings change.
          Q="$T/it's"
          /bin/bash ./install.sh --prefix "$Q" --source "file://$PWD" v0.0.1-ci >/dev/null
          cp "$S" "$T/before"
          ! /bin/bash ./install.sh --prefix "$Q" --settings "$S" --wire 2>/dev/null ||
            fail "a prefix holding a single quote must be refused"
          cmp -s "$S" "$T/before" || fail "a refused wiring changed the settings"
          # Unwiring removes only these entries, and the hooks key once it is empty.
          run --unwire >/dev/null
          jq -e '([.hooks[][].hooks[].command] | sort) == ["/x/custom-beads-sync.sh", "/x/fmt.sh", "/x/stop.sh"]' "$S" >/dev/null ||
            fail "unwire left: $(jq -c . "$S")"
          echo '{"hooks": {"SessionEnd": [{"hooks": [{"type": "command", "command": "/a/beads-sync.sh"}]}]}}' >"$S"
          run --unwire >/dev/null
          [ "$(jq -c . "$S")" = '{}' ] || fail "an emptied hooks key must go: $(jq -c . "$S")"
          # Rewiring and unwiring clean every event, recognise the name followed by a
          # separator, and drop an entry that is one hook itself only where it runs these.
          jq -n '{hooks: {
            Stop: [{hooks: [{type: "command", command: "/old/beads-sync.sh"}]},
                   {hooks: [{type: "command", command: "/x/stop.sh"}]}],
            afterShellExecution: [{hooks: [{type: "command", command: "/old/beads-sync.sh"}]}],
            PostToolUse: [{matcher: "bash", hooks: [{type: "command", command: "/old/beads-sync.sh; true"}]},
                          {matcher: "bash", hooks: [{type: "command", command: "/old/beads-sync.sh&&true"}]}],
            SessionEnd: [{type: "command", command: "/x/bare-foreign.sh"},
                         {type: "command", command: "/old/beads-sync.sh"}]}}' >"$T/s3.json"
          run3() { /bin/bash ./install.sh --prefix "$P" --settings "$T/s3.json" "$@"; }
          cmds() { jq -r '.hooks[][] | if (.hooks | type) == "array" then .hooks[] else . end | .command' "$T/s3.json"; }
          run3 --status >"$T/out"
          for e in 'Stop: /old/beads-sync.sh' 'afterShellExecution: /old/beads-sync.sh' \
            'PostToolUse: /old/beads-sync.sh; true' 'PostToolUse: /old/beads-sync.sh&&true' \
            'SessionEnd: /old/beads-sync.sh'; do
            grep -qF "wired: $e" "$T/out" || fail "status missed a legacy entry: $e"
          done
          run3 --wire >/dev/null
          c=$(cmds)
          ! grep -q '^/old/' <<<"$c" || fail "rewiring left a legacy hook: $(jq -c . "$T/s3.json")"
          [ "$(grep -c 'current/.augment/hooks/beads-' <<<"$c")" = 3 ] || fail "rewiring did not add exactly three entries"
          grep -qx /x/stop.sh <<<"$c" && grep -qx /x/bare-foreign.sh <<<"$c" || fail "rewiring dropped another hook"
          run3 --unwire >/dev/null
          [ "$(cmds | sort | tr '\n' ' ')" = "/x/bare-foreign.sh /x/stop.sh " ] ||
            fail "unwire left: $(jq -c . "$T/s3.json")"
          # The README lists exactly the files a project holding a copy deletes.
          diff <(sed -n 's/^ *\(\.augment\/hooks\/[^ ]*\)$/\1/p' README.md | sort) \
            <(git ls-files .augment/hooks | sort) >/dev/null ||
            fail "README's list of the files this repository supplies is out of date"
          echo "installer check: ok"

      # /bin/bash rather than bash: on macOS it is 3.2. The suites run the
      # hooks under their own interpreter, so this covers the hooks as well.
      - name: Run hook test suites
        run: |
          /bin/bash --version | head -1
          /bin/bash .augment/hooks/test/classification_test.sh
          /bin/bash .augment/hooks/test/lock_test.sh
          /bin/bash .augment/hooks/test/prime_test.sh
